      - generic [ref=e37]:
        - heading "Acesso à sua conta em ambiente seguro" [level=1] [ref=e38]
        - paragraph [ref=e39]: O eSocial é um sistema informatizado da Administração Pública e todas as informações nele contidas estão protegidas por sigilo. O acesso não autorizado, a disponibilização voluntária ou acidental da senha de acesso ou de informações e a quebra do sigilo constituem infrações ou ilícitos que sujeitam o usuário a responsabilidade administrativa, penal e civil.
        - paragraph [ref=e40]: O usuário declara-se ciente das responsabilidades acima referidas ao acessar qualquer sistema no sítio eletrônico do eSocial.
        - heading "Módulo Simplificado" [level=2] [ref=e41]
        - paragraph [ref=e42]:
          - text: Disponível para o Empregador Doméstico, o Segurado Especial e o MEI – Microempreendedor Individual. A partir de 12/06/2023, o acesso é feito exclusivamente via login do Gov.br. O acesso por meio de código de acesso e senha foi descontinuado. Para mais informações sobre o Gov.br e como realizar seu cadastro,
          - link "clique aqui" [ref=e43] [cursor=pointer]:
            - /url: http://faq-login-unico.servicos.gov.br/en/latest/_perguntasdafaq/contaacesso.html
          - text: .
        - heading "Módulo Web Geral" [level=2] [ref=e44]
        - paragraph [ref=e45]: As Empresas e o Empregador Pessoa Física poderão acessar o eSocial por meio do login do Gov.br, sendo necessário o cadastro prévio e atribuição do respectivo selo de confiabilidade no Portal Gov.br (será exigido o tipo de selo “Certificado Digital”).
        - paragraph [ref=e46]:
          - text: Ressalte-se que o cadastramento é realizado uma única vez. A empresa optante pelo SIMPLES, que tenha até um empregado, ou MEI – Microempreendedor Individual, também somente poderá efetuar login utilizando o Gov.br para acessar o eSocial, uma vez que o acesso mediante código de acesso e senha foi descontinuado a partir de 12/06/2023. Para mais informações sobre o Gov.br e como realizar seu cadastro,
          - link "clique aqui" [ref=e47] [cursor=pointer]:
            - /url: http://faq-login-unico.servicos.gov.br/en/latest/_perguntasdafaq/contaacesso.html
          - text: .
